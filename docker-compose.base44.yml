services:
  web:
    image: nginx:1.27-alpine
    restart: on-failure
    ports:
      - "3000:80"
    volumes:
      # Static site served straight from the cloned source: edits on disk are
      # visible on the next page refresh, with no image rebuild.
      - ./:/usr/share/nginx/html:ro
      - ./docker/nginx.base44.main.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx.base44.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    labels:
      base44.project: "FoodieExpress"
      base44.kind: "web"
      base44.port: "3000"
