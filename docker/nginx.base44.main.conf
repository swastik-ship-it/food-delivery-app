# Minimal nginx main config for the Base44 sandbox.
#
# The repo is bind-mounted from a directory that is mode 700 and owned by root,
# so the stock image's unprivileged `nginx` workers cannot traverse it (every
# request 403/404s). Running the workers as root lets them read the mount.
# This is a local dev-only preview server; do not use it as a production config.
user root;
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /var/log/nginx/access.log;
    sendfile on;
    keepalive_timeout 65;

    include /etc/nginx/conf.d/*.conf;
}
